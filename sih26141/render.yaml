# Render Blueprint — deploys the whole stack as ONE web service:
# the Rust API server + the built React dashboard behind the same URL.
#
# Deploy: Render dashboard → New → Blueprint → point at this repo → Apply.
# Afterwards every laptop just opens https://<service>.onrender.com
#
# Free-tier notes (plan: free below):
#   * the service sleeps after ~15 minutes idle — first request after a
#     nap pays a ~30–60 s cold start while the image boots;
#   * the free tier has no persistent disk, so users.json / audit_log.jsonl /
#     qds_events.jsonl reset when the service restarts — re-register demo
#     accounts afterwards (fine for evaluation; upgrade to `plan: starter`
#     + a 1 GB disk for true 24/7 uptime and persistence).
services:
  - type: web
    name: sih26141-quantum-pipeline
    runtime: docker
    # Monorepo: this blueprint lives inside sih26141/, so pin the service
    # root directory there. dockerfilePath / dockerContext are resolved
    # RELATIVE TO rootDir (Render docs: Monorepo Support → root-relative
    # settings), so they point at the Dockerfile in this same folder.
    rootDir: sih26141
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free # upgrade to "starter" for always-on 24/7 + a persistent disk
    healthCheckPath: /api/health
    autoDeploy: true
    # 5 MB documents → ~9 MB JSON request bodies; Render's proxy allows
    # larger bodies than the server's own 12 MB cap, so no extra config.
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      # Pins the QDS notary's setup randomness so signatures are
      # deterministic across instance restarts. Replace before deploying.
      - key: TRENT_SEED
        generateValue: true
    # A persistent disk requires a paid plan; see the free-tier notes above.
    # disk:
    #   name: sih26141-data
    #   mountPath: /data
    #   sizeGB: 1
