[workspace]
members = [
    "quantum",
    "pa",
    "crypto",
    "detection",
    "attacks",
    "qds",
    "audit",
    "sealing",
    "main_app",
    "server",
    "tui",
    "tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SIH26141 Team"]

# Deliberately minimal: strip symbols from the deployed server binary (the
# Docker runtime image ships it). No other overrides — default opt-level 3
# and codegen behavior are fine, and panic=abort would change failure
# semantics for a long-running server.
[profile.release]
strip = true
